[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "exptoolkit"
version = "0.2.1"
description = "Data management toolkit for battery and experimental data processing and visualization."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "t-onoz" }
]
keywords = ["data", "processing", "visualization", "toolkit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries"
]

dependencies = [
  "numpy",
  "polars",
  "pydantic>=2",
  "webcolors",
  "pint",
  "xlsxwriter",
  "eval-type-backport ; python_version < \"3.9\"",
  "typing_extensions ; python_version < \"3.11\"",
]


[project.optional-dependencies]
plotting = [
  "matplotlib",
  "openpyxl",
  "plotly",
]

qt = [
  "pyqtgraph",
  "PySide6",
]

pandas = [
  "pandas",
]

dev = [
  "pytest",
  "pytest-cov",
  "black",
  "isort",
  "flake8",
  "mypy",
  "pre-commit",
  "tox",
  "coverage",
  "tox-uv",
  "pandas-stubs",
  "types-openpyxl"
]


[tool.setuptools.packages.find]
where = ["src"]
include = ["exptoolkit*", "batanalysis*"]


[tool.tox]
env_list = ["py38", "py39", "py310", "py311", "py312", "py313"]


[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
extras = ["dev"]
commands = [
  ["pytest"]
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.ruff]
line-length = 100


[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "UP",
  "B",
]


[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
